<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .lit   { fill: #ffffff; stroke: #dbe4ee; stroke-width: 1.3; }
      .hole  { fill: #eaf2fb; stroke: #2563eb; stroke-width: 1.5; }
      .val   { fill: #fff7e0; stroke: #e0a100; stroke-width: 1.3; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #1f3550; }
      .quote { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; fill: #1b4b91; font-weight: 700; }
      .role  { font-size: 12px; fill: #5b6b7f; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1b4b91; }
      .link  { stroke: #2563eb; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <text class="quote" x="12" y="48">f"</text>
  <rect class="lit" x="36" y="26" width="130" height="34" rx="6"/>
  <text class="mono" x="101" y="48" text-anchor="middle">My float is </text>
  <rect class="hole" x="172" y="26" width="76" height="34" rx="6"/>
  <text class="mono" x="210" y="48" text-anchor="middle">{var1}</text>
  <rect class="lit" x="254" y="26" width="150" height="34" rx="6"/>
  <text class="mono" x="329" y="48" text-anchor="middle"> and my int is </text>
  <rect class="hole" x="410" y="26" width="76" height="34" rx="6"/>
  <text class="mono" x="448" y="48" text-anchor="middle">{var2}</text>
  <text class="quote" x="492" y="48">"</text>

  <path class="link" d="M 210 60 V 94" marker-end="url(#arrow)"/>
  <path class="link" d="M 448 60 V 94" marker-end="url(#arrow)"/>
  <rect class="val" x="180" y="98" width="60" height="30" rx="6"/>
  <text class="mono" x="210" y="118" text-anchor="middle">17.5</text>
  <rect class="val" x="418" y="98" width="60" height="30" rx="6"/>
  <text class="mono" x="448" y="118" text-anchor="middle">5</text>
  <text class="role" x="506" y="118">value of the variable,</text>
  <text class="role" x="506" y="134">read at run time</text>

  <text class="role" x="12" y="160">Everything outside the braces is copied as is; each <tspan class="mono">{expression}</tspan> is replaced by its value.</text>
</svg>
