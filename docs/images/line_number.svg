<svg xmlns="http://www.w3.org/2000/svg" width="230" height="50" viewBox="0 0 230 50" role="img" aria-label="Clicking the line number 42 in the viewer">
  <!-- Two lines of the edtrace viewer: grey line numbers on the left; the one under the mouse turns black. -->
  <rect x="0.5" y="0.5" width="229" height="49" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="34" y="20" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c8c8c8">41</text>
  <text x="48" y="20" font-family="Consolas, Menlo, monospace" font-size="14" fill="#57606a">def files():</text>
  <text x="34" y="40" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="bold" fill="#000000">42</text>
  <text x="80" y="40" font-family="Consolas, Menlo, monospace" font-size="14" fill="#57606a">text("# 12. Files")</text>
  <!-- mouse pointer on the number -->
  <path d="M 37 33 L 37 47 L 40.5 43.5 L 43 49 L 45 48 L 42.5 42.5 L 47 42.5 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
