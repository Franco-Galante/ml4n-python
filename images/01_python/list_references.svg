<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .list  { fill: #eaf2fb; stroke: #2563eb; stroke-width: 1.6; }
      .slot  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.2; }
      .obj   { fill: #ffffff; stroke: #8494a8; stroke-width: 1.3; }
      .field { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1f3550; }
      .index { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #5b6b7f; }
      .link  { stroke: #2563eb; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- the list: a row of references -->
  <rect class="list" x="30" y="24" width="180" height="28" rx="6"/>
  <text class="field" x="44" y="43">type: list</text>
  <rect class="slot" x="30" y="52" width="60" height="44"/>
  <rect class="slot" x="90" y="52" width="60" height="44"/>
  <rect class="slot" x="150" y="52" width="60" height="44"/>
  <text class="index" x="38" y="68">0</text>
  <text class="index" x="98" y="68">1</text>
  <text class="index" x="158" y="68">2</text>
  <circle cx="60" cy="80" r="3.5" fill="#2563eb"/>
  <circle cx="120" cy="80" r="3.5" fill="#2563eb"/>
  <circle cx="180" cy="80" r="3.5" fill="#2563eb"/>

  <!-- the objects it refers to -->
  <rect class="obj" x="30" y="166" width="150" height="62" rx="10"/>
  <line x1="30" y1="192" x2="180" y2="192" stroke="#dbe4ee"/>
  <text class="field" x="44" y="184">type: float</text>
  <text class="field" x="44" y="215">value: 5.6</text>

  <rect class="obj" x="230" y="146" width="180" height="62" rx="10"/>
  <line x1="230" y1="172" x2="410" y2="172" stroke="#dbe4ee"/>
  <text class="field" x="244" y="164">type: str</text>
  <text class="field" x="244" y="195">value: 'my string'</text>

  <rect class="obj" x="450" y="98" width="150" height="62" rx="10"/>
  <line x1="450" y1="124" x2="600" y2="124" stroke="#dbe4ee"/>
  <text class="field" x="464" y="116">type: int</text>
  <text class="field" x="464" y="147">value: 3</text>

  <path class="link" d="M 60 80 C 60 120, 90 130, 100 162" marker-end="url(#arrow)"/>
  <path class="link" d="M 120 80 C 140 130, 250 110, 300 142" marker-end="url(#arrow)"/>
  <path class="link" d="M 180 80 C 280 80, 380 110, 446 124" marker-end="url(#arrow)"/>
</svg>
