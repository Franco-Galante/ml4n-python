<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 252" width="860" height="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .parent { fill: #dbe7f7; stroke: #2563eb; stroke-width: 1.4; }
      .copy   { fill: #eaf2fb; stroke: #2563eb; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .node   { fill: #ffffff; stroke: #8494a8; stroke-width: 1.2; }
      .fresh  { fill: #eaf2fb; stroke: #2563eb; stroke-width: 1.6; }
      .leaf   { fill: #f5f9fd; stroke: #dbe4ee; stroke-width: 1.2; }
      .title  { font-size: 14px; fill: #1f3550; font-weight: 700; }
      .pname  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1f3550; font-weight: 600; }
      .nname  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1f3550; }
      .edge   { stroke: #8494a8; stroke-width: 1.3; fill: none; }
      .shared { stroke: #2563eb; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- ── shallow ─────────────────────────────────────────────────────── -->
  <text class="title" x="30" y="26">Shallow copy</text>
  <rect class="parent" x="30" y="46" width="130" height="40" rx="8"/>
  <text class="pname" x="95" y="71" text-anchor="middle">parent</text>
  <rect class="copy" x="220" y="46" width="160" height="40" rx="8"/>
  <text class="pname" x="300" y="71" text-anchor="middle">parent.copy()</text>

  <path class="edge" d="M 95 86 L 90 140"/>
  <path class="edge" d="M 95 86 L 270 140"/>
  <path class="shared" d="M 300 86 L 90 140"/>
  <path class="shared" d="M 300 86 L 270 140"/>

  <rect class="node" x="58" y="140" width="64" height="28" rx="6"/>
  <text class="nname" x="90" y="159" text-anchor="middle">tuple</text>
  <rect class="node" x="238" y="140" width="64" height="28" rx="6"/>
  <text class="nname" x="270" y="159" text-anchor="middle">list</text>

  <path class="edge" d="M 90 168 L 63 212"/>
  <path class="edge" d="M 90 168 L 113 212"/>
  <path class="edge" d="M 270 168 L 243 212"/>
  <path class="edge" d="M 270 168 L 293 212"/>
  <rect class="leaf" x="48" y="212" width="30" height="26" rx="5"/>
  <text class="nname" x="63" y="230" text-anchor="middle">a</text>
  <rect class="leaf" x="98" y="212" width="30" height="26" rx="5"/>
  <text class="nname" x="113" y="230" text-anchor="middle">b</text>
  <rect class="leaf" x="228" y="212" width="30" height="26" rx="5"/>
  <text class="nname" x="243" y="230" text-anchor="middle">1</text>
  <rect class="leaf" x="278" y="212" width="30" height="26" rx="5"/>
  <text class="nname" x="293" y="230" text-anchor="middle">2</text>

  <line x1="425" y1="14" x2="425" y2="238" stroke="#dbe4ee" stroke-width="1"/>

  <!-- ── deep ────────────────────────────────────────────────────────── -->
  <text class="title" x="470" y="26">Deep copy</text>
  <rect class="parent" x="470" y="46" width="130" height="40" rx="8"/>
  <text class="pname" x="535" y="71" text-anchor="middle">parent</text>
  <rect class="copy" x="650" y="46" width="190" height="40" rx="8"/>
  <text class="pname" x="745" y="71" text-anchor="middle">copy.deepcopy(parent)</text>

  <path class="edge" d="M 535 86 L 530 140"/>
  <path class="edge" d="M 535 86 L 650 140"/>
  <path class="shared" d="M 745 86 L 530 140"/>
  <path class="shared" d="M 745 86 L 790 140"/>

  <rect class="node" x="498" y="140" width="64" height="28" rx="6"/>
  <text class="nname" x="530" y="159" text-anchor="middle">tuple</text>
  <rect class="node" x="618" y="140" width="64" height="28" rx="6"/>
  <text class="nname" x="650" y="159" text-anchor="middle">list</text>
  <rect class="fresh" x="758" y="140" width="64" height="28" rx="6"/>
  <text class="nname" x="790" y="159" text-anchor="middle">list</text>

  <path class="edge" d="M 530 168 L 503 212"/>
  <path class="edge" d="M 530 168 L 553 212"/>
  <path class="edge" d="M 650 168 L 695 212"/>
  <path class="edge" d="M 650 168 L 745 212"/>
  <path class="shared" d="M 790 168 L 695 212"/>
  <path class="shared" d="M 790 168 L 745 212"/>
  <rect class="leaf" x="488" y="212" width="30" height="26" rx="5"/>
  <text class="nname" x="503" y="230" text-anchor="middle">a</text>
  <rect class="leaf" x="538" y="212" width="30" height="26" rx="5"/>
  <text class="nname" x="553" y="230" text-anchor="middle">b</text>
  <rect class="leaf" x="680" y="212" width="30" height="26" rx="5"/>
  <text class="nname" x="695" y="230" text-anchor="middle">1</text>
  <rect class="leaf" x="730" y="212" width="30" height="26" rx="5"/>
  <text class="nname" x="745" y="230" text-anchor="middle">2</text>

</svg>
